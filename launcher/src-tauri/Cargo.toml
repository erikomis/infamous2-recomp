[package]
name = "infamous2-launcher"
version = "0.1.0"
description = "Launcher for the inFAMOUS 2 static-recompilation port: rebuild from your own copy, settings, play"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "infamous2_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the saves manager's .zip files (both already in the tree through tauri)
flate2 = "1"
crc32fast = "1"
